<div class="title-wrap">
<h1 class="logo" aria-label="Strangers’ Showers">
	<span class="row1" aria-hidden="true"
		><span class="big">S</span><span class="small">TRANGER</span><span class="big">S</span><span class="apos">’</span></span
	>
	<span class="row2" aria-hidden="true"><span class="bar"></span><span class="word">SHOWERS</span><span class="bar"></span></span>
</h1>

<div class="tagline">
	<p class="up">Come si testa ciò che si vede</p>
	<p class="down" aria-label="Come si testa cosa non si vede">Come si testa cosa non si vede</p>
</div>
</div>

<script type="module">
	const up = document.querySelector(".tagline .up")
	const down = document.querySelector(".tagline .down")
	const fit = () => down.style.setProperty("--fit", up.offsetWidth / down.offsetWidth)
	document.fonts.ready.then(fit)
	new ResizeObserver(fit).observe(up)
</script>

<style>
