<h1 class="accent">Tutti i punti, dal vivo</h1>
<p class="light">
	Ogni vertice della doccia è un <strong>punto proiettato</strong> dalla camera.
	Stessa v4 di prima, con il debug acceso: ecco cosa calcola davvero.
</p>

<div class="wc-stage">
	<shower-previewer></shower-previewer>
</div>

<!-- Accende i debug points PRIMA che il web component monti:
     il componente legge window.location.search in onMounted -->
<script>
	(() => {
		const url = new URL(window.location.href)
		if (!url.searchParams.has("showerPreviewerDebugPoints")) {
			url.searchParams.set("showerPreviewerDebugPoints", "")
			window.history.replaceState(null, "", url)
		}
	})()
</script>
<script src="/shower/v4-modern.wc.js"></script>
