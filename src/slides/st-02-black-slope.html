<!-- Stessa snapshot, con gli stop del gradiente inclinato forzati a nero (come faceva Chrome vecchio, #831) -->
<script type="module">
	const src = "/strangers/kitchen-sink/two-sides-sloped-art.svg"
	const svg = await (await fetch(src)).text()
	const broken = svg.replace(/(id="slopeGradient"[\s\S]*?<\/linearGradient>)/, (gradient) =>
		gradient.replace(/(<stop offset="(?!0%)[^"]*" style="stop-color: )[^;]*;/g, "$1black;"),
	)
	document.getElementById("black-slope").src = URL.createObjectURL(new Blob([broken], { type: "image/svg+xml" }))
</script>
